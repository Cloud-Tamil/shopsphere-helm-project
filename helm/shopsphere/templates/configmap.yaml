apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shopsphere.fullname" . }}-config
  labels:
    {{- include "shopsphere.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.global.environment | default "development" | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | default "info" | quote }}
  PORT: {{ .Values.config.port | default "5000" | quote }}
  DEFAULT_CURRENCY: {{ .Values.config.currency | default "USD" | quote }}
  ENABLE_DISCOUNTS: {{ .Values.config.enableDiscounts | default "true" | quote }}
  CACHE_TTL_SECONDS: {{ .Values.config.cacheTtlSeconds | default "300" | quote }}
  APP_VERSION: {{ .Chart.AppVersion | quote }}
