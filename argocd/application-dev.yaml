apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopsphere-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: dev
    app: shopsphere
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-org/shopsphere-helm-project.git'
    targetRevision: HEAD
    path: helm/shopsphere
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: shopsphere-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
